name: field-sales-prod

# Production: no source mounts, no reload, database not published. Reads secrets from .env on the server.
# Start with: docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    # Multi-arch PostGIS build. The official postgis/postgis tag has no arm64 image, and the server is arm64.
    image: imresamu/postgis:16-3.4
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ENVIRONMENT: production
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    # Bound to loopback: nginx on the host is the only way in.
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8200}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
